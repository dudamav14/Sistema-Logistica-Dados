<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Fretes e IA</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9;}
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1, h2 { color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; }
        input, select, button { padding: 10px; width: 100%; box-sizing: border-box; margin-top: 5px; }
        button { background-color: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; border-radius: 5px; }
        button:hover { background-color: #0056b3; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #007bff; color: white; }
        .ia-box { background-color: #e9ecef; padding: 15px; border-radius: 5px; margin-top: 20px; border-left: 5px solid #007bff; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Painel de Logística</h1>
        <h2>Cadastro de Encomendas</h2>
        <form id="formEncomenda">
            <div class="form-group">
                <label for="codigo">Código de Rastreio:</label>
                <input type="text" id="codigo" required placeholder="Ex: BR123456">
            </div>
            <div class="form-group">
                <label for="regiao">Região de Destino:</label>
                <select id="regiao">
                    <option value="">Selecione uma região</option>
                    <option value="Centro-Oeste">Centro-Oeste</option>
                    <option value="Nordeste">Nordeste</option>
                    <option value="Norte">Norte</option>  
                    <option value="Sudeste">Sudeste</option>
                    <option value="Sul">Sul</option>                   
                </select>
            </div>
            <div class="form-group">
                <label for="progresso">Progresso (%):</label>
                <input type="number" id="progresso" required min="0" max="100" step="0.1" placeholder="Ex: 20.5">
            </div>
            <div class="form-group">
                <label for="distancia">Distância (Km):</label>
                <input type="number" id="distancia" required min="1" step="0.1" placeholder="Ex: 350.5">
            </div>
            <button type="submit">Salvar Encomenda</button>
        </form>

        <h2>Encomendas Cadastradas</h2>
        <table id="tabelaEncomendas">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Código de Rastreio</th>
                    <th>Região</th>
                    <th>Distância (Km)</th> 
                    <th>Progresso (%)</th>
                    <th>Custo</th>
                </tr>
            </thead>
            <tbody>  
             </tbody>
        </table>

        <h2> Custo Médio por Região</h2>
        <canvas id="graficoRegioes" width="400" height="150"></canvas>

        <h2>Análise de Inteligência Artificial</h2>
            <button type="button" id="btnIa">Gerar Resumo Executivo (IA)</button>
            <div id="resultadoIa" class="ia-box" style="display: none;">
        </div>
    </div>

    <script>
        const API_URL = '/api/encomendas';
        let meuGrafico = null;

        async function carregarEncomendas() {
            try {
                const resposta = await fetch(API_URL);
                const encomendas = await resposta.json();
                
                const tbody = document.querySelector('#tabelaEncomendas tbody');
                tbody.innerHTML = ''; 
                

                encomendas.forEach(enc => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${enc.id}</td>
                        <td>${enc.codigoRastreio}</td>
                        <td>${enc.regiaoDestino}</td>
                        <td>${enc.distanciaKm} km</td>
                        <td>${enc.percentualProgresso}</td>
                        <td>R$ ${enc.custoFrete.toFixed(2)}</td>
                    `;
                    tbody.appendChild(tr);
                });

                const somasPorRegiao = {};
                const contagemPorRegiao = {};

                encomendas.forEach(enc => {
                    const regiao = enc.regiaoDestino;
                    if (!somasPorRegiao[regiao]) {
                        somasPorRegiao[regiao] = 0;
                        contagemPorRegiao[regiao] = 0;
                    }
                    somasPorRegiao[regiao] += enc.custoFrete;
                    contagemPorRegiao[regiao] += 1;
                });

               
                const rotulos = Object.keys(somasPorRegiao);
                const dadosGrafico = rotulos.map(regiao => somasPorRegiao[regiao] / contagemPorRegiao[regiao]);

              
                if (meuGrafico != null) {
                    meuGrafico.destroy();
                }

                const ctx = document.getElementById('graficoRegioes').getContext('2d');
                meuGrafico = new Chart(ctx, {
                    type: 'bar', 
                    data: {
                        labels: rotulos, 
                        datasets: [{
                            label: 'Custo Médio (R$)',
                            data: dadosGrafico, 
                            backgroundColor: 'rgba(54, 162, 235, 0.6)', 
                            borderColor: 'rgba(54, 162, 235, 1)',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        scales: {
                            y: { beginAtZero: true }
                        }
                    }
                });

            } catch (erro) {
                console.error("Erro ao carregar dados:", erro);
            }
        }

        document.getElementById('formEncomenda').addEventListener('submit', async function(event){
           event.preventDefault();
           
           const novaEncomenda = {
                codigoRastreio: document.getElementById('codigo').value,
                regiaoDestino: document.getElementById('regiao').value,
                distanciaKm: parseFloat(document.getElementById('distancia').value),
                percentualProgresso: parseFloat(document.getElementById('progresso').value)
           };

           try {
            await fetch(API_URL, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(novaEncomenda)
            });

            document.getElementById('formEncomenda').reset();
            carregarEncomendas();

           } catch(erro){
            console.error('Erro ao salvar encomenda:', erro);
           }

        });

        document.getElementById('btnIa').addEventListener('click', async function() {
            const divIa = document.getElementById('resultadoIa');
            divIa.style.display = 'block';
            divIa.innerHTML = 'Gerando resumo executivo...';

            try{
                const resposta = await fetch(`${API_URL}/resumo-ia`);
                const texto = await resposta.text();

                divIa.innerHTML = texto;
            } catch(erro){
        
                divIA.innerHTML = '<span style="color:red">Erro ao conectar com a IA.</span>';
            }
        });
        carregarEncomendas();
    </script>
</body>
</html>
